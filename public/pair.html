<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADM Link Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #f5f7fb;
            color: #111827;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border-radius: 14px;
            background: #111827;
            color: #ffffff;
            font-size: 20px;
            font-weight: 700;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            width: 100%;
            height: 50px;
            margin-top: 14px;
            border: 0;
            border-radius: 10px;
            background: #111827;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f3f4f6;
            text-align: center;
        }

        .result.show {
            display: block;
        }

        .code {
            margin: 12px 0;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 4px;
            color: #111827;
        }

        .instructions {
            margin-top: 15px;
            color: #6b7280;
            font-size: 13px;
            line-height: 1.6;
        }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #6b7280;
            text-align: center;
        }

        .error {
            color: #dc2626;
        }

        .success {
            color: #15803d;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">ADM</div>

    <h1>ADM Link Hub</h1>

    <p class="subtitle">
        Connect your WhatsApp account using a secure pairing code.
    </p>

    <form id="pairForm">
        <label for="number">WhatsApp number</label>

        <input
            id="number"
            type="tel"
            placeholder="256XXXXXXXXX"
            autocomplete="tel"
            required
        >

        <button id="pairButton" type="submit">
            Get Pairing Code
        </button>
    </form>

    <div id="status" class="status"></div>

    <div id="result" class="result">
        <div>Pairing Code</div>

        <div id="code" class="code">--------</div>

        <div class="instructions">
            Open WhatsApp on your phone.<br>
            Go to Settings → Linked Devices → Link a Device.<br>
            Select "Link with phone number instead" and enter the code above.
        </div>
    </div>

    <div class="footer">
        ADM Link Hub
    </div>
</div>

<script>
    const form = document.getElementById('pairForm');
    const numberInput = document.getElementById('number');
    const pairButton = document.getElementById('pairButton');
    const statusElement = document.getElementById('status');
    const resultElement = document.getElementById('result');
    const codeElement = document.getElementById('code');

    function normalizeNumber(number) {
        return String(number || '').replace(/\D/g, '');
    }

    function setStatus(message, type = '') {
        statusElement.textContent = message;
        statusElement.className = 'status ' + type;
    }

    async function getCode(number) {
        const response = await fetch(
            '/api/pair/' + encodeURIComponent(number)
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || 'Unable to get pairing code.'
            );
        }

        return data.code;
    }

    form.addEventListener('submit', async event => {
        event.preventDefault();

        const number = normalizeNumber(
            numberInput.value
        );

        if (!number) {
            setStatus(
                'Enter a valid WhatsApp number.',
                'error'
            );
            return;
        }

        pairButton.disabled = true;
        resultElement.classList.remove('show');
        setStatus('Creating pairing session...');

        try {
            const response = await fetch('/api/pair', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    number
                })
            });

            const data = await response.json();

            if (!response.ok || !data.success) {
                throw new Error(
                    data.error ||
                    'Failed to create pairing session.'
                );
            }

            let code = data.code;

            if (!code) {
                setStatus(
                    'Waiting for pairing code...'
                );

                for (let i = 0; i < 20; i++) {
                    await new Promise(resolve =>
                        setTimeout(resolve, 2000)
                    );

                    code = await getCode(number);

                    if (code) {
                        break;
                    }
                }
            }

            if (!code) {
                throw new Error(
                    'Pairing code is not available yet. Try again.'
                );
            }

            codeElement.textContent = code;
            resultElement.classList.add('show');

            setStatus(
                'Pairing code generated successfully.',
                'success'
            );
        } catch (error) {
            setStatus(
                error.message ||
                'Something went wrong.',
                'error'
            );
        } finally {
            pairButton.disabled = false;
        }
    });
</script>

</body>
</html>
